name: release

# 推 v* 标签即发布：每个目标平台各自构建二进制、刷新摘要、打成 SForum 包并挂到 Release。
# 也可用 workflow_dispatch 手动跑（会先做校验与构建，不创建 Release，除非填了 tag）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sforum_ref:
        description: 构建所使用的 SForum 引用（tag / 分支 / commit）
        required: false
        default: main

permissions:
  contents: write

env:
  SFORUM_REPOSITORY: zhuchunshu/SForum
  SFORUM_REF: ${{ github.event.inputs.sforum_ref || 'main' }}
  PACKAGE_SLUG: sforum-oauth2-provider

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/backend/go.mod
          cache-dependency-path: plugin/backend/go.sum

      - name: Point SDK replace at the checked-out framework
        working-directory: plugin/backend
        run: go mod edit -replace github.com/zhuchunshu/sforum/apps/api="$GITHUB_WORKSPACE/sforum/apps/api"

      - name: Backend vet and unit tests
        working-directory: plugin/backend
        run: |
          go vet ./...
          go test ./...

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('plugin/sforum.extension.json'))['version'])")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error title=版本不一致::标签 v$TAG_VERSION 与 sforum.extension.json 的 version ($MANIFEST_VERSION) 不一致。"
            exit 1
          fi

      - name: Build host binary and run host contract checks
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/plugin/backend"
          (cd plugin/backend && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/plugin/backend/plugin" ./)
          cd sforum/apps/api
          go run ./cmd/sforum extension digest --write "$GITHUB_WORKSPACE/plugin"
          go run ./cmd/sforum extension validate "$GITHUB_WORKSPACE/plugin"
          go run ./cmd/sforum extension test "$GITHUB_WORKSPACE/plugin"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/backend/go.mod
          cache-dependency-path: plugin/backend/go.sum

      - name: Point SDK replace at the checked-out framework
        working-directory: plugin/backend
        run: go mod edit -replace github.com/zhuchunshu/sforum/apps/api="$GITHUB_WORKSPACE/sforum/apps/api"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }} package
        id: package
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # 只复制运行时需要的文件：源码、CI、脚本都不进发布包。
          # 注意：排除项要用 / 前缀锚定到仓库根，否则 'dist/' 会连
          # frontend/admin/dist（运行时前端制品）一起排掉。
          rsync -a \
            --exclude '/.git/' --exclude '/.github/' --exclude '/.build/' --exclude '/dist/' \
            --exclude '/docs/' --exclude '/scripts/' --exclude '/backend/*.go' --exclude '/backend/go.mod' \
            --exclude '/backend/go.sum' --exclude '/backend/plugin' --exclude '/backend/plugin.exe' \
            "$GITHUB_WORKSPACE/plugin/" "$STAGE/"

          (cd plugin/backend && \
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "$STAGE/backend/plugin" ./)

          VERSION="$(python3 -c "import json;print(json.load(open('plugin/sforum.extension.json'))['version'])")"
          ASSET="${PACKAGE_SLUG}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd sforum/apps/api
          # 每个平台的二进制不同，摘要必须按该平台重新写入后再打包。
          go run ./cmd/sforum extension digest --write "$STAGE"
          go run ./cmd/sforum extension validate "$STAGE"
          go run ./cmd/sforum extension package "$STAGE" --exclude-source -o "$GITHUB_WORKSPACE/dist/$ASSET.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/*.zip
            dist/*.zip.sbom.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum *.zip | tee SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo '## 安装'
            echo
            echo '1. 下载与服务器平台匹配的压缩包（`linux_amd64` / `linux_arm64` / `darwin_arm64` / `darwin_amd64`）。'
            echo '2. 放到 SForum 的扩展安装位置之一：'
            echo '   - 上传：后台「插件管理 → 安装插件」选择 zip；'
            echo '   - 或解压到外部源码根：`<EXTERNAL_EXTENSION_ROOTS>/plugins/sforum-oauth2-provider/`。'
            echo '3. 后台启用 **OAuth2 Provider**，按宿主提示完成一次 exact-artifact `super_admin` 信任确认。'
            echo '4. 需要“管理全部应用”的角色，到「角色权限」授予 `sforum.oauth2-provider.manage_clients`。'
            echo
            echo '每个压缩包内的清单摘要与其中可执行文件一一对应，跨平台包不可混用；校验：`sha256sum -c SHA256SUMS`。'
            echo
            echo '## 兼容性'
            echo
            echo '使用宿主 Protocol V2（`sforum.host@2`）与 Manifest V3，需要 SForum `>=0.1.0`。'
            echo '若启用失败，请对照 README 的「Host 约束」章节。'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
